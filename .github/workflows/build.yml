name: Build & Release

# 触发：仅手动（Actions 页面 workflow_dispatch 一键启动）。
# 正式发布由维护者在本机构建并直接发布 Release，不由推送自动触发。
# 需要产出 macOS 安装包时（只能在 macOS runner 上构建），在 Actions 页面手动运行本工作流即可。
on:
  workflow_dispatch:

# 同一 ref 的多次构建自动取消，避免重复占用 runner
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# 允许工作流创建 Release 并上传安装包
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64 (安装器)
            script: pack:win
            artifact: HongGuo-PC-Windows-x64
            glob: 'desktop/dist-electron/*.exe'
          # macOS 只跑一个任务：electron-builder 会在同一台 Apple Silicon 机器上
          # 同时产出 x64 与 arm64 两个 dmg（electron-builder.config.cjs 的 mac.target 已声明两个架构）。
          # 早期拆成 macos-13(Intel) + macos-14(arm64) 两个任务时，Intel runner 长时间排队等不到机器。
          - os: macos-14
            name: macOS (DMG x64 + arm64)
            script: pack:mac
            artifact: HongGuo-PC-macOS
            glob: 'desktop/dist-electron/*.dmg'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            backend/package-lock.json

      # 后端依赖会被一并打进安装包（extraResources），必须先安装
      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Install desktop deps
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # 各平台脚本内部已包含 vite build（保证 app.asar 内含 dist/index.html）
      - name: Build & package (${{ matrix.name }})
        working-directory: desktop
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.blockmap' \) -exec cp {} release-files/ \;
          ls -lh release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
